[build-system]
requires = ["setuptools>=62.3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deepinv_bench"
version = "0.0.1"
dependencies = [
    "torch",
    "deepinv[dataset,denoisers,physics]",
    "benchopt>=1.8.0",
]

[project.optional-dependencies]
test = [
    "pytest",
    "datasets",
    "pyiqa",
]

[tool.setuptools.packages.find]
include = ["deepinv_bench*"]
exclude = ["deepinv_bench.tests*"]
namespaces = false

# benchopt loads the benchmark tree by file path, so ship it as data.
[tool.setuptools.package-data]
deepinv_bench = [
    "benchmarks/**/*.py",
    "benchmarks/**/*.yml",
]

